@if (isOpen) {
  <div class="lightbox" (click)="close()">
    <button class="lightbox__close" (click)="close(); $event.stopPropagation()" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>

    @if (hasPrev) {
      <button class="lightbox__nav lightbox__nav--prev" (click)="prev(); $event.stopPropagation()" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
    }

    @if (hasNext) {
      <button class="lightbox__nav lightbox__nav--next" (click)="next(); $event.stopPropagation()" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    }

    <div class="lightbox__contenedor">
      <img [src]="currentImage" alt="" class="lightbox__imagen"
        (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)"
        (click)="$event.stopPropagation()"
        draggable="false" />
    </div>
  </div>
}
